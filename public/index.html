<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>RFID tools</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    body { 
      font-family: system-ui, Arial; 
      margin: 0;
      padding: 20px;
      background: #ECE1E9;
      color: #2E6467;
    }
    .row{ margin-bottom: 8px }
    textarea{ 
      width:100%; 
      height:200px;
      background: #ECE1E9;
      border: 2px solid #5B7785;
      color: #2E6467;
      padding: 8px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
    }
    button{ 
      margin-right:6px;
      background: #5B7785;
      color: #ECE1E9;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
    }
    button:hover {
      background: #2E6467;
    }
    input, select {
      background: #ECE1E9;
      border: 2px solid #5B7785;
      color: #2E6467;
      padding: 6px 10px;
      border-radius: 4px;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #C29762;
    }
    h2, h3, h4 {
      color: #2E6467;
    }
    .header-row { 
      display:flex; 
      align-items:center; 
      justify-content:space-between;
      background: #5B7785;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .header-row h2 {
      color: #ECE1E9;
      margin: 0;
    }
    .small { 
      font-size:90%; 
      color: #ECE1E9;
    }
    /* Backdrop for sidebar */
    #sidebar-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(46, 100, 103, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 199;
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms ease;
    }
    #sidebar-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }
    /* Toasts */
    #toasts { position: fixed; right: 16px; bottom: 16px; z-index: 9999; display:flex; flex-direction:column; gap:8px; align-items:flex-end; }
    .toast { background: rgba(34,34,34,0.95); color: #fff; padding:10px 14px; border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,0.2); min-width:160px; max-width:360px; font-size:13px; }
    .toast.info { background: #2b6cb0; }
    .toast.success { background: #2f855a; }
    .toast.error { background: #c53030; }
    .toast small { display:block; opacity:0.9; font-size:11px; margin-top:4px }
  </style>
</head>
<body>

  <!-- Backdrop for sidebar blur effect -->
  <div id="sidebar-backdrop"></div>

  <!-- Sidebar (hidden by default) - moved here so it's not nested and can be shown regardless of mode -->
  <div id="sidebar" style="position:fixed;right:0;top:0;width:320px;height:100%;background:#fff;border-left:2px solid #5B7785;box-shadow:-4px 0 12px rgba(0,0,0,0.08);padding:16px;transform:translateX(100%);transition:transform 220ms ease;will-change:transform;z-index:200" aria-hidden="true">
    <div style="text-align:center;padding:16px 0;border-bottom:2px solid #5B7785;margin-bottom:16px">
      <h2 style="margin:0;color:#2E6467;font-size:24px">RFID Tools</h2>
      <div id="version-commit" style="margin-top:8px;font-size:12px;color:#5B7785;font-family:monospace">v1.0.0-loading...</div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <strong style="color:#2E6467;font-size:16px">Settings</strong>
      <button id="sidebar_close" style="background:#5B7785;color:#ECE1E9;border:none;padding:8px 12px;border-radius:4px;cursor:pointer;font-weight:600">Close</button>
    </div>
    <div style="margin-bottom:10px">
      <label class="small" style="color:#2E6467;font-weight:600;display:block;margin-bottom:4px">Connection</label>
      <select id="sb_conn_mode" style="width:100%">
        <option value="server">Server Proxy</option>
        <option value="webserial">Web Serial (Browser)</option>
      </select>
    </div>
    <div style="margin-bottom:10px">
      <label class="small" style="color:#2E6467;font-weight:600;display:block;margin-bottom:4px">Mode</label>
      <select id="sb_mode" style="width:100%">
        <option value="simple">Simple</option>
        <option value="advanced">Advanced</option>
        <option value="hid">HID</option>
      </select>
    </div>
    <div style="margin-bottom:10px">
      <label class="small" style="color:#2E6467;font-weight:600;display:block;margin-bottom:4px">Protocol</label>
      <select id="sb_protocol" style="width:100%">
        <option value="auto">Auto</option>
        <option value="mifare">MIFARE Classic</option>
        <option value="ntag">NTAG / NXP</option>
      </select>
    </div>
    <div style="margin-bottom:10px">
      <label class="small" style="color:#2E6467;font-weight:600;display:block;margin-bottom:4px">Key</label>
      <input id="sb_key" placeholder="FF,FF,FF,FF,FF,FF or default" style="width:100%" />
    </div>
    <div style="margin-bottom:10px">
      <label class="small" style="color:#2E6467;font-weight:600"><input type="checkbox" id="sb_verbose" /> Verbose logs</label>
    </div>
    <div style="margin-top:16px">
      <button id="open_serial_page" style="background:#5B7785;color:#ECE1E9;border:none;padding:8px 12px;border-radius:4px;cursor:pointer">Open Serial Output Page</button>
    </div>
    <div style="margin-top:12px">
      <a id="github_link" href="https://github.com/bluekiwidev/Rfid-tools" target="_blank" rel="noopener noreferrer" style="display:inline-block;background:#24292e;color:#fff;padding:8px 12px;border-radius:4px;text-decoration:none">View on GitHub</a>
    </div>
    <!-- HID controls moved to dedicated HID page -->
  </div>

  <!-- Serial output full-page view (hidden) - moved here so it's available outside advanced UI -->
  <div id="serial_page" style="display:none;position:fixed;inset:0;background:#fff;z-index:300;padding:16px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <strong>Serial Output</strong>
      <div>
        <button id="serial_back" style="margin-right:8px;background:#5B7785;color:#ECE1E9;border:none;padding:6px 8px;border-radius:4px;cursor:pointer">Back</button>
        <button id="serial_clear" style="background:#a33;color:#fff;border:none;padding:6px 8px;border-radius:4px;cursor:pointer">Clear</button>
      </div>
    </div>
    <textarea id="serial_only_log" readonly style="width:100%;height:calc(100% - 48px);background:#000;color:#0f0;padding:8px;overflow:auto"></textarea>
  </div>

  <div class="header-row">
    <div style="display:flex;align-items:center;gap:12px">
      <button id="header_sidebar_toggle" title="Settings" aria-expanded="false" style="background:transparent;border:none;color:#ECE1E9;font-size:20px;cursor:pointer;padding:6px 8px;position:relative;z-index:210">☰</button>
      <h2 style="margin:0">RFID Control Panel</h2>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <!-- Controls moved to settings sidebar to reduce header clutter -->
    </div>
  </div>

  <div id="status" style="margin-bottom:12px;background:#5B7785;padding:12px;border-radius:6px">
    <span id="status-dot" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#c00;margin-right:8px;vertical-align:middle"></span>
    <strong id="status-text" style="color:#ECE1E9">Disconnected</strong>
    <span id="status-detail" style="margin-left:12px;color:#ECE1E9;font-size:90%;opacity:0.8"></span>
    <span id="reader-status" style="margin-left:18px;padding:6px 10px;border-radius:6px;background:#ECE1E9;color:#2E6467;font-weight:600">idle</span>
  </div>

  <!-- Inline control boxes -->
  <div style="display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap">
    <!-- Serial Port Connection -->
    <div style="border:2px solid #5B7785;background:white;padding:10px;border-radius:6px;flex:1;min-width:300px">
      <h4 style="margin:0 0 8px 0;color:#2E6467;font-size:14px">Serial Port</h4>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        <button id="list" style="padding:6px 10px;font-size:13px">List</button>
        <select id="ports" style="min-width:150px;padding:5px 8px;font-size:13px"></select>
        <button id="connect" style="padding:6px 10px;font-size:13px">Connect</button>
        <button id="disconnect" style="padding:6px 10px;font-size:13px">Disconnect</button>
      </div>
    </div>

    <!-- Card UID Reader -->
    <div style="border:2px solid #5B7785;background:white;padding:10px;border-radius:6px;flex:1;min-width:250px">
      <h4 style="margin:0 0 8px 0;color:#2E6467;font-size:14px">Card UID</h4>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        <button id="read_uid" style="padding:6px 10px;font-size:13px">Read UID</button>
        <span style="font-size:13px"><strong>UID:</strong> <span id="simple_uid">-</span></span>
      </div>
    </div>

    <!-- General Controls -->
    <div style="border:2px solid #5B7785;background:white;padding:10px;border-radius:6px;flex:1;min-width:250px">
      <h4 style="margin:0 0 8px 0;color:#2E6467;font-size:14px">General</h4>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <!-- Primary dump button (also available in Advanced block editor) -->
        <button id="dump_general" style="padding:6px 10px;font-size:13px">Dump Tag</button>
        <button id="reset_pico" style="padding:6px 10px;font-size:13px">Reset Pico</button>
        <button id="clear_log" style="padding:6px 10px;font-size:13px">Clear Output</button>
      </div>
    </div>
  </div>

  <!-- Advanced-only controls -->
  <div id="advanced_ui" style="border:2px solid #5B7785;background:white;padding:12px;margin-top:12px;border-radius:6px;display:none">
    <h3 style="margin-top:0;color:#2E6467">Advanced Controls</h3>
    <div class="row">
      <label class="small" style="margin-left:8px"><input type="checkbox" id="verbose" /> Verbose logs</label>
      <!-- Sidebar toggle (hamburger) -->
      <button id="sidebar_toggle" title="Open settings" style="margin-left:12px; background:transparent;border:none;color:#ECE1E9;font-size:20px;cursor:pointer">☰</button>
      <label style="margin-left:12px;margin-right:6px">Block</label>
      <input id="addr" type="number" min="0" max="63" value="4" style="width:80px;margin-right:8px;padding:6px 8px" />
      <button id="read_block">Read Block</button>
      <button id="write_block">Write Block</button>
      <button id="dump" style="margin-left:8px;padding:6px 10px;font-size:13px">Dump Tag</button>
    </div>

    <div class="row">
      <input id="write_data" placeholder="comma-separated bytes" style="width:420px" />
    </div>

    <div class="row">
      <input id="ndef_text" placeholder="NDEF text" style="width:400px" />
      <button id="format_ndef">Format NDEF (write empty)</button>
      <button id="write_ndef">Write NDEF</button>
    </div>
  </div>

  <!-- Simple mode UI -->
  <div id="simple_ui" style="border:2px solid #5B7785;background:white;padding:12px;margin-top:12px;border-radius:6px">
    <h3 style="color:#2E6467">Block Editor</h3>
    <div class="row">
      <div style="margin-left:18px"><strong>Block0:</strong> <span id="simple_block0">-</span></div>
    </div>
    <div class="row">
      <label style="margin-right:6px">Block</label>
      <select id="simple_block" style="width:120px"></select>
      <button id="simple_read_block">Read Block</button>
      <input id="simple_text" placeholder="text to write (will be utf-8) or comma bytes" style="width:300px" />
      <button id="simple_write">Write Text To Block</button>
      <button id="simple_erase" style="background:#a33;margin-left:6px">Erase Block</button>
      <div style="margin-top:6px">Read result: <span id="simple_read_result">-</span></div>
    </div>
    <div class="row">
      <h4>Dump</h4>
      <div id="dump_table_wrap" style="max-height:300px;overflow:auto;border:2px solid #5B7785;padding:8px;background:#ECE1E9;border-radius:4px"></div>
    </div>
  </div>

  <!-- HID Page (full controls for HID mapping) -->
  <div id="hid_page" style="border:2px solid #5B7785;background:white;padding:12px;margin-top:12px;border-radius:6px;display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <h3 style="margin:0;color:#2E6467">HID Mode</h3>
      <div>
        <button id="hid_back" style="background:#5B7785;color:#ECE1E9;border:none;padding:6px 8px;border-radius:4px;cursor:pointer">Back</button>
      </div>
    </div>
    <div style="margin-bottom:12px">
      <label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="hid_enabled" /> Enable HID (keyboard)</label>
      <label style="display:flex;align-items:center;gap:8px;margin-top:8px"><input type="checkbox" id="hid_enter" /> Append Enter after typing</label>
    </div>
    <div style="margin-bottom:12px">
      <label class="small" style="display:block;margin-bottom:6px;color:#2E6467;font-weight:600">Mappings</label>
      <div style="display:flex;gap:8px;margin-bottom:8px;align-items:center">
        <input id="hid_uid_input" placeholder="UID (scan to fill)" style="flex:1" readonly />
        <button id="hid_scan_btn" style="padding:6px 10px">Scan</button>
        <input id="hid_text_input" placeholder="Text to type" style="flex:2" />
      </div>
      <div style="display:flex;gap:8px;margin-bottom:8px">
        <button id="hid_add_btn">Add / Save</button>
        <button id="hid_refresh_btn">Refresh</button>
        <button id="hid_cancel_btn" style="display:none;background:#a33">Cancel</button>
      </div>
      <div id="hid_map_list" style="max-height:360px;overflow:auto;border:1px solid #eee;padding:8px;background:#f9f9f9;border-radius:4px"></div>
    </div>
  </div>

  <!-- Serial Output -->
  <div style="border:2px solid #5B7785;background:white;padding:12px;margin-top:12px;border-radius:6px">
    <h3 style="margin-top:0;color:#2E6467">Serial Output</h3>
    <textarea id="log" readonly></textarea>
  </div>

  <!-- Toast container -->
  <div id="toasts" aria-live="polite" aria-atomic="true"></div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="client.js"></script>
</body>
</html>
